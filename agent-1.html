<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة الوكالة - الحصة التموينية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF3E2;--card:#FFFFFF;--ink:#1B1610;--mute:#7C6A50;--line:#E9D9B8;--acc:#A5560A;--btn:#F5A524;--btnfg:#1B1610;--thbg:#FFEFCB;--bad:#B93A2B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;font-size:17px;line-height:1.6;padding:16px 16px 84px 16px}
main{max-width:640px;margin:0 auto}
h1{font-size:24px;margin:8px 0 12px}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:26px;color:var(--acc);line-height:1.2}
.stat span{color:var(--mute);font-size:14px}
form,.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
label{display:block;font-weight:500;margin:10px 0 4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.two{display:flex;gap:10px}.two>div{flex:1}
button{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer}
button.main{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
button.bad{color:var(--bad);border-color:var(--bad)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.search{margin:18px 0 10px;position:relative}
.row{margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.row h3{margin:0;font-size:18px}
.row p{margin:2px 0 0;color:var(--mute);font-size:15px}
.num{direction:ltr;unicode-bidi:embed}
.lk{color:var(--acc);text-decoration:underline;cursor:pointer}
[hidden]{display:none!important}
.info{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 14px;margin-bottom:16px}
.info div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.info div:last-child{border:0}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;text-align:center;font-size:14px}
th{background:var(--thbg);color:var(--acc);padding:8px 4px}
td,th{border:1px solid var(--line);padding:6px 3px}
td input[type=checkbox]{width:20px;height:20px;accent-color:var(--btn)}
td input[type=number]{width:60px;text-align:center;padding:4px}
</style>
</head>
<body>

<main id="home">
<h1>عبد السلام سعد نجم عبوش</h1>
<div style="color:var(--mute);margin-bottom:12px">إدارة الوكالة - الحصة التموينية</div>
<div class="search">
  <input id="q" placeholder="ابحث بالاسم أو رقم البطاقة">
  <button id="qx" type="button" hidden style="position:absolute;left:10px;top:10px;border:none;background:none;font-size:20px;cursor:pointer">×</button>
</div>
<button class="main" id="addb" type="button" style="width:100%;margin-bottom:12px">إضافة عائلة جديدة</button>
<form id="f" autocomplete="off" hidden>
  <label for="n">اسم المواطن</label>
  <input id="n" required>
  <div class="two">
    <div><label for="c">رقم البطاقة التموينية</label><input id="c" inputmode="numeric" required></div>
    <div><label for="k">عدد الأفراد</label><input id="k" type="number" min="1" max="50" inputmode="numeric" required></div>
  </div>
  <div class="acts">
    <button class="main" id="save" type="submit">حفظ العائلة</button>
    <button type="button" id="cancel">إلغاء</button>
  </div>
</form>
<div class="stats">
  <div class="stat"><b id="sc">0</b><span>عدد العوائل</span></div>
  <div class="stat"><b id="sp">0</b><span>مجموع الأفراد</span></div>
</div>
<div id="list"></div>
</main>

<main id="det" hidden>
<button id="back" type="button">← الرجوع للقائمة</button>
<h1 id="dn"></h1>
<div class="info" id="di"></div>
<h2>جدول الحصص الشهرية</h2>
<div class="tw"><table><thead><tr id="thr"></tr></thead><tbody id="tb"></tbody></table></div>
<div class="acts"><button class="main" id="tsave" type="button" style="width:100%;margin-top:10px">حفظ التأشيرات والتغيرات</button></div>
<div id="tm" style="margin-top:8px;font-weight:bold"></div>
</main>

var data = [];
var $=function(i){return document.getElementById(i)};

function load(){
  try{
    var r=localStorage.getItem(KEY);
    data=r?JSON.parse(r):[];
  }catch(e){data=[]}
  if(!Array.isArray(data) || data.length < 100){
    data = ALL_CITIZENS.map(function(x){ return Object.assign({}, x, {members: x.fam, records: {}}); });
    store();
  }
}

function store(){
  try{
    localStorage.setItem(KEY, JSON.stringify(data));
  }catch(e){}
}

function render(){
  var q = ($("q").value || "").trim().toLowerCase();
  $("qx").hidden = !q;
  var L = $("list"); L.innerHTML = "";
  var rows = data.filter(function(x){
    return !q || x.name.toLowerCase().indexOf(q) > -1 || x.card.indexOf(q) > -1;
  });
  $("sc").textContent = data.length;
  $("sp").textContent = data.reduce(function(a,x){return a + (x.fam||x.members||0);}, 0);

  if(!rows.length){
    L.innerHTML = "<div style='text-align:center;padding:20px;color:var(--mute)'>لا توجد نتائج مطابقة</div>";
    return;
  }

  rows.forEach(function(x){
    var r = document.createElement("div"); r.className = "row";
    r.innerHTML = "<div><h3 class='lk'>" + x.name + "</h3><p>بطاقة رقم <span class='num'>" + x.card + "</span> - " + (x.fam||x.members) + " أفراد</p></div>";
    r.querySelector("h3").onclick = function(){ show(x.id || x.card); };
    L.appendChild(r);
  });
}

$("f").onsubmit = function(e){
  e.preventDefault();
  var n = $("n").value.trim(), c = $("c").value.trim(), k = parseInt($("k").value, 10);
  if(!n || !c || !k) return;
  data.unshift({id: "c_" + Date.now(), name: n, card: c, fam: k, members: k, records: {}});
  store();
  $("f").reset(); $("f").hidden = true; render();
};

$("addb").onclick = function(){ $("f").hidden = !$("f").hidden; };
$("cancel").onclick = function(){ $("f").hidden = true; };
$("q").oninput = render;
$("qx").onclick = function(){ $("q").value = ""; render(); };

var cur = null;
var MN = ["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي عشر","الثاني عشر"];
var HD = ["طحين","زيت","سكر","معجون","رز","بقوليات"];

function show(id){
  cur = data.find(function(y){ return y.id === id || y.card === id; });
  if(!cur) return;
  $("home").hidden = true; $("det").hidden = false;
  $("dn").textContent = cur.name;
  $("di").innerHTML = "<div><span>رقم البطاقة:</span><b>" + cur.card + "</b></div><div><span>عدد الأفراد:</span><b>" + (cur.fam||cur.members) + "</b></div>";
  
  var thr = $("thr"); thr.innerHTML = "<th>الشهر</th>";
  HD.forEach(function(h){ thr.innerHTML += "<th>" + h + "</th>"; });
  thr.innerHTML += "<th>المبلغ</th>";

  var tb = $("tb"); tb.innerHTML = "";
  cur.records = cur.records || {};

  MN.forEach(function(m, i){
    var tr = document.createElement("tr");
    var html = "<td>" + m + "</td>";
    HD.forEach(function(col){
      var isChecked = cur.records[i + "_" + col] ? "checked" : "";
      html += "<td><input type='checkbox' data-m='" + i + "' data-c='" + col + "' " + isChecked + "></td>";
    });
    var pr = cur.records[i + "_price"] || "";
    html += "<td><input type='number' data-m='" + i + "' data-p='1' value='" + pr + "'></td>";
    tr.innerHTML = html;
    tb.appendChild(tr);
  });
}

$("tsave").onclick = function(){
  if(!cur) return;
  cur.records = cur.records || {};
  var inputs = $("tb").querySelectorAll("input");
  inputs.forEach(function(inp){
    var m = inp.dataset.m;
    if(inp.type === "checkbox"){
      var c = inp.dataset.c;
      cur.records[m + "_" + c] = inp.checked;
    } else if(inp.dataset.p){
      cur.records[m + "_price"] = inp.value;
    }
  });
  store();
  $("tm").style.color = "var(--acc)";
  $("tm").textContent = "تم حفظ التغيرات بنجاح ✓";
};

$("back").onclick = function(){ $("det").hidden = true; $("home").hidden = false; render(); };

load(); render();
