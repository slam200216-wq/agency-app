<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>بوابة المواطن</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff;
  --card: #fff;
  --ink: #1B1610;
  --mute: #7C6A50;
  --line: #E9D9B0;
  --acc: #A55604;
  --btn: #F5A524;
  --btntfg: #1B1610;
  --bad: #C53030;
  --thbg: #FDF6E2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D1520;
    --card: #152134;
    --ink: #E8F0F8;
    --mute: #9DB1CE;
    --line: #26374F;
    --acc: #70B2F5;
    --btn: #2B3E5A;
    --btntfg: #E8F0F8;
    --thbg: #1B2A40;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Tajawal, Tahoma, Arial, sans-serif; font-size: 17px; line-height: 1.5; }
main { max-width: 560px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
[hidden] { display: none !important; }
h1 { font-size: 24px; margin: 8px 0 2px; }
.sub { color: var(--mute); margin-bottom: 16px; }
button { font: inherit; font-weight: 500; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; }
button.main { background: var(--btn); color: var(--btntfg); border-color: var(--btn); width: 100%; padding: 12px; font-weight: 700; }
.big { display: flex; align-items: center; gap: 12px; width: 100%; padding: 18px 16px; border: 0; border-radius: 16px; font-size: 20px; font-weight: 700; text-align: right; }
.big.r { background: #F5A524; color: #1B1610; }
.big.w { background: #2F7BE5; color: #fff; }
label { display: block; font-weight: 500; margin: 12px 0 4px; }
input { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
input:focus, button:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
#m { min-height: 28px; margin-top: 10px; color: var(--bad); }
.logo { flex: 1; position: relative; min-height: 200px; margin-top: 8px; }
.logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.info { border: 1px solid var(--line); border-radius: 10px; padding: 2px 14px; margin: 10px 0 14px; background: var(--card); }
.info div { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
.info div:last-child { border-bottom: 0; }
.info span { color: var(--mute); }
h2 { font-size: 19px; margin: 14px 0 8px; }
.tw { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; text-align: center; font-size: 12.5px; }
th { background: var(--thbg); color: var(--acc); padding: 6px 1px; font-size: 11.5px; line-height: 1.3; }
td, th { border: 1px solid var(--line); padding: 6px 2px; }
td:first-child { font-size: 12px; line-height: 1.2; }
.ck { color: var(--acc); font-weight: 700; font-size: 16px; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
#up { color: var(--mute); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>

<main id="s1">
  <h1>بوابة المواطن</h1>
  <div class="sub">عبد السلام سعد نجم عبوش - وكالة المواد الغذائية</div>
  <button class="big r" id="gr" type="button">الحصة التموينية</button>
  <div style="height:12px;"></div>
  <button class="big w" id="gw" type="button">أعادة الاجتماعية</button>
  <div class="logo"><img alt="شعار الوكالة" src="logo.png"></div>
</main>

<main id="s2" hidden>
  <div><button id="b2" type="button" aria-label="رجوع">←</button></div>
  <h1 id="ttl"></h1>
  <form id="f" autocomplete="off">
    <label for="nn">اسم رب الأسرة (الاسم الثلاثي كما في البطاقة)</label>
    <input id="nn" required>
    <label for="cd" id="l1">رقم البطاقة التموينية</label>
    <input id="cd" inputmode="numeric" required>
    <button class="main" type="submit" style="margin-top:16px;">دخول</button>
    <div id="m" role="alert"></div>
  </form>
  <div class="logo"><img alt="شعار الوكالة" src="logo.png"></div>
</main>

<main id="s3" hidden>
  <div class="bar"><button id="b3" type="button">خروج</button></div>
  <h1 id="fn"></h1>
  <div class="sub" id="fsub"></div>
  <div class="info">
    <div><span>رقم البطاقة</span><strong id="icd"></strong></div>
    <div><span>نوع الخدمة</span><strong id="isrv"></strong></div>
    <div><span>الحالة</span><strong style="color:#16a34a">مسجل ومفعل ✓</strong></div>
  </div>
  <h2>مستحقات الحصة التموينية</h2>
  <div class="tw">
    <table>
      <thead>
        <tr>
          <th>المادة</th>
          <th>القرص</th>
          <th>المقرر</th>
          <th>المستلم</th>
          <th>المتبقي</th>
        </tr>
      </thead>
      <tbody id="tb">
        <tr><td>الطحين</td><td>كيس</td><td>5</td><td>5</td><td><span class="ck">✓</span></td></tr>
        <tr><td>التمن (الرز)</td><td>كغ</td><td>3</td><td>3</td><td><span class="ck">✓</span></td></tr>
        <tr><td>السكر</td><td>كغ</td><td>2</td><td>2</td><td><span class="ck">✓</span></td></tr>
        <tr><td>زيت الطعام</td><td>لتر</td><td>1</td><td>1</td><td><span class="ck">✓</span></td></tr>
        <tr><td>معجون الطماطم</td><td>علبة</td><td>2</td><td>2</td><td><span class="ck">✓</span></td></tr>
      </tbody>
    </table>
  </div>
  <div id="up">آخر تحديث: أكتوبر 2026</div>
</main>

<script>
let mode = 'r';
const s1 = document.getElementById('s1');
const s2 = document.getElementById('s2');
const s3 = document.getElementById('s3');
const ttl = document.getElementById('ttl');
const l1 = document.getElementById('l1');
const f = document.getElementById('f');
const m = document.getElementById('m');
const nn = document.getElementById('nn');
const cd = document.getElementById('cd');

document.getElementById('gr').onclick = () => {
  mode = 'r';
  ttl.textContent = 'الحصة التموينية';
  l1.textContent = 'رقم البطاقة التموينية';
  s1.hidden = true;
  s2.hidden = false;
};

document.getElementById('gw').onclick = () => {
  mode = 'w';
  ttl.textContent = 'أعادة الاجتماعية';
  l1.textContent = 'رقم البطاقة / الرمز الشريطي';
  s1.hidden = true;
  s2.hidden = false;
};

document.getElementById('b2').onclick = () => {
  s2.hidden = true;
  s1.hidden = false;
  m.textContent = '';
  f.reset();
};

document.getElementById('b3').onclick = () => {
  s3.hidden = true;
  s1.hidden = false;
  f.reset();
};

f.onsubmit = (e) => {
  e.preventDefault();
  m.textContent = '';
  const nVal = nn.value.trim();
  const cVal = cd.value.trim();
  if(!nVal || !cVal) {
    m.textContent = 'يرجى ملء كافة الحقول';
    return;
  }
  document.getElementById('fn').textContent = nVal;
  document.getElementById('fsub').textContent = mode === 'r' ? 'مواطن - الحصة التموينية' : 'مواطن - أعادة الاجتماعية';
  document.getElementById('icd').textContent = cVal;
  document.getElementById('isrv').textContent = mode === 'r' ? 'الحصة التموينية' : 'أعادة الاجتماعية';
  s2.hidden = true;
  s3.hidden = false;
};
</script>
</body>
</html>
