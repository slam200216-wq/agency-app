<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة المواطن</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#1B1610;--mute:#7C6A50;--line:#E9D9B8;--acc:#A5560A;--btn:#F5A524;--btnfg:#1B1610;--thbg:#FFEFCB;--bad:#B93A2B;--ok:#2E7D32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-sec="welfare"]{--mute:#58698A;--line:#D1DDEF;--acc:#1A5AB8;--btn:#2F7BE5;--btnfg:#fff;--thbg:#DCE8FA;--ink:#0F1B2D}
@media (prefers-color-scheme:dark){:root{--bg:#15110C;--card:#211A12;--ink:#F6EEDD;--mute:#BBA784;--line:#3B3023;--acc:#F7B64D;--thbg:#2E2415;--bad:#F08B80;--ok:#7FCB82}
:root[data-sec="welfare"]{--bg:#0D1520;--card:#152134;--ink:#E8F0FB;--mute:#9DB1CE;--line:#26374F;--acc:#7DB2F5;--thbg:#1B2A42}
.logo img{filter:invert(1) hue-rotate(180deg)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;font-size:17px;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
[hidden]{display:none!important}
h1{font-size:24px;margin:8px 0 2px}
.sub{color:var(--mute);margin-bottom:16px}
button{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer}
button.main{background:var(--btn);color:var(--btnfg);border-color:var(--btn);width:100%;padding:12px;font-weight:700}
.big{display:flex;align-items:center;gap:12px;width:100%;padding:18px 16px;border:0;border-radius:16px;font-size:20px;font-weight:700;margin-bottom:12px;text-align:right}
.big.r{background:#F5A524;color:#1B1610}.big.w{background:#2F7BE5;color:#fff}
label{display:block;font-weight:500;margin:12px 0 4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#m{min-height:26px;margin-top:10px;color:var(--bad)}
.logo{flex:1;position:relative;min-height:200px;margin-top:8px}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.info{border:1px solid var(--line);border-radius:10px;padding:2px 14px;margin:10px 0 14px;background:var(--card)}
.info div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}.info div:last-child{border:0}
.info span{color:var(--mute)}
h2{font-size:19px;margin:14px 0 8px}
.tw{border:1px solid var(--line);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed;text-align:center;font-size:12.5px}
th{background:var(--thbg);color:var(--acc);padding:6px 1px;font-size:11.5px;line-height:1.3}
td,th{border:1px solid var(--line)}td{padding:6px 2px}
td:first-child{font-size:12px;line-height:1.2}
.ck{color:var(--ok);font-weight:700;font-size:16px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
#up{color:var(--mute);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<main id="s1">
<h1>بوابة المواطن</h1>
<div class="sub">عبد السلام سعد نجم عبوش - وكالة للمواد الغذائية</div>
<button class="big r" id="gR" type="button">الحصة التموينية</button>
<button class="big w" id="gW" type="button">الرعاية الاجتماعية</button>
<div class="logo"><img alt="شعار الوكالة" src="logo.png"></div>
</main>

<main id="s2" hidden>
<div><button id="b2" type="button" aria-label="رجوع">→</button></div>
<h1 id="ttl"></h1>
<form id="f" autocomplete="off">
<label for="nm">اسم رب الأسرة (الاسم الثلاثي كما في البطاقة)</label><input id="nm" required>
<label for="cd">رقم البطاقة التموينية</label><input id="cd" inputmode="numeric" required>
<button class="main" type="submit" style="margin-top:16px">ادخل</button>
<div id="m" role="alert"></div>
</form>
<div class="logo"><img alt="" src="logo.png"></div>
</main>

<main id="s3" hidden>
<div class="bar"><button id="b3" type="button">→ خروج</button></div>
<h1 id="fn"></h1>
<div class="sub" id="fs"></div>
<div class="info" id="di"></div>
<h2>جدول الحصص الشهرية</h2>
<div class="tw"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div>
<div id="up"></div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getFirestore,doc,onSnapshot} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const db=getFirestore(initializeApp(firebaseConfig));
/*PURE1-START*/
function nz(s){return String(s||"").replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ی/g,"ي").replace(/ک/g,"ك").replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).toLowerCase()}
function compact(s){return nz(s).replace(/\s+/g,"")}
function digits(s){return nz(s).replace(/\D/g,"")}
async function keyOf(sec,name,card){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(sec+"|"+digits(card)+"|"+compact(name).slice(0,8)));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
/*PURE1-END*/

var $=function(i){return document.getElementById(i)},sec="ration",cred=null,unsub=null;
var HD={ration:["طحين","زيت","سكر","معجون","رز","بقوليات"],welfare:["حليب","طحين","سكر","شاي","زيت"]};
var TT={ration:"الحصة التموينية",welfare:"الرعاية الاجتماعية"};
var MN=["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي عشر","الثاني عشر"];
function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function stop(){if(unsub){unsub();unsub=null}}
function show(n){["s1","s2","s3"].forEach(function(i){$(i).hidden=i!==n});if(n!=="s3")stop();window.scrollTo(0,0)}
function pick(s){sec=s;if(s==="welfare")document.documentElement.dataset.sec="welfare";else delete document.documentElement.dataset.sec;$("ttl").textContent=TT[s];$("m").textContent="";show("s2")}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function toFam(d){var t=[];try{t=d.tj?JSON.parse(d.tj):[]}catch(e){}return{name:d.name,card:d.card,fam:d.fam,ent:d.ent,blk:d.blk,t:t}}
function draw(f){
  var t=f.t||[],ent=f.ent!=null?f.ent:f.fam,debt=0,H=HD[sec];
  for(var i=11;i>=0;i--){var v=t[i]&&t[i][7];if(v!==undefined&&v!==null&&v!==""){ent=v;break}}
  t.forEach(function(r){debt+=(r&&r[6])||0});
  var blk=ent===f.ent?f.blk:Math.max(0,f.fam-ent);
  $("fn").textContent=f.name;$("fs").textContent=TT[sec];
  var di=$("di");di.innerHTML="";
  [["رقم البطاقة",f.card],["عدد الأفراد",f.fam],["المستحقون",ent],["المحجوبون",blk],["المبلغ الكلي",debt?fmt(debt)+" د.ع":""]].forEach(function(p){
    if(p[1]===undefined||p[1]===null||p[1]==="")return;var d=mk("div");d.appendChild(mk("span","",p[0]));d.appendChild(mk("b","",p[1]));di.appendChild(d)});
  var th=$("th");th.innerHTML="";["الشهر"].concat(H).concat(["الأفراد","المبلغ"]).forEach(function(x){th.appendChild(mk("th","",x))});
  var tb=$("tb");tb.innerHTML="";
  MN.forEach(function(m,i){var r=t[i]||[],tr=mk("tr");tr.appendChild(mk("td","",m));
    H.forEach(function(_,j){tr.appendChild(r[j]?mk("td","ck","✓"):mk("td","",""))});
    tr.appendChild(mk("td","",r[7]!=null&&r[7]!==""?r[7]:""));tr.appendChild(mk("td","",r[6]?fmt(r[6]):""));tb.appendChild(tr)});
  $("up").textContent="آخر تحديث: "+new Date().toLocaleTimeString("ar-IQ")+" (يتحدّث تلقائياً)"}
async function go(){
  stop();
  if(compact(cred.n).length<6){$("m").textContent="اكتب الاسم الثلاثي كما في البطاقة التموينية.";return}
  if(!digits(cred.c)){$("m").textContent="اكتب رقم البطاقة بالأرقام.";return}
  var k=await keyOf(sec,cred.n,cred.c),first=true;
  unsub=onSnapshot(doc(db,sec,k),function(snap){
    if(!snap.exists()){stop();if(first)$("m").textContent="البيانات غير مطابقة. تأكد من الاسم ورقم البطاقة.";else exit();first=false;return}
    first=false;draw(toFam(snap.data()));show("s3")},
    function(){$("m").textContent="تعذر الاتصال. حاول مرة أخرى."})}
function exit(){cred=null;$("f").reset();show("s1")}
$("gR").onclick=function(){pick("ration")};$("gW").onclick=function(){pick("welfare")};
$("b2").onclick=function(){show("s1")};$("b3").onclick=exit;
$("f").onsubmit=function(e){e.preventDefault();cred={n:$("nm").value,c:$("cd").value};$("m").textContent="";go()};
</script>
</body>
</html>
